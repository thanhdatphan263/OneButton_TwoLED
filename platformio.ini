[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    mathertel/OneButton @ ^2.6.1

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
    '-D BTN_PIN=5U'
    '-D BTN_ACT=LOW'
    '-D LED1_PIN=2U'
    '-D LED1_ACT=HIGH'
    '-D LED2_PIN=4U'
    '-D LED2_ACT=HIGH'

[env:esp32c3_super_mini]
board = esp32c3_super_mini
build_flags =
    '-D BTN_PIN=9U'
    '-D BTN_ACT=LOW'
    '-D LED1_PIN=8U'
    '-D LED1_ACT=LOW'
    '-D LED2_PIN=4U'
    '-D LED2_ACT=HIGH'